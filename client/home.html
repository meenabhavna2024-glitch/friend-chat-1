<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friend Chat</title>

    <link rel="stylesheet" href="home.css">
</head>

<body>

<div class="app">

    <!-- Header -->
    <div class="header">

        <div>
            <h2>Friend Chat</h2>
            <p>Connect • Chat • Share</p>
        </div>

        <div class="menu">
            ☰
        </div>

    </div>


    <!-- My Profile -->
    <div class="profile">

        <div class="dp">
            👤
        </div>

        <div class="info">

            <h3 id="myName">User</h3>

            <p>🟢 Online</p>

        </div>

    </div>


    <!-- Search -->
    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Search friends..."
        >

    </div>


    <!-- Contact List -->
    <div class="contacts" id="contacts">

        <p class="loading">
            Users loading...
        </p>

    </div>


    <!-- Bottom Button -->
    <div class="bottom">

        <button onclick="newChat()">
            + New Chat
        </button>

    </div>

</div>


<script>

const myName = localStorage.getItem("name");
const myMobile = localStorage.getItem("mobile");


// Login check
if (!myName || !myMobile) {

    window.location.href = "login.html";

}


// Show my name
document.getElementById("myName").innerText = myName;


// Users array
let allUsers = [];


// Get users from MongoDB
async function loadUsers() {

    const contacts = document.getElementById("contacts");

    try {

        const response = await fetch(
            "https://friend-chat-1-5k6l.onrender.com/users"
        );

        if (!response.ok) {

            throw new Error("Users API failed");

        }

        const users = await response.json();

        allUsers = users;

        showUsers(users);

    } catch (error) {

        console.log("Users Error:", error);

        contacts.innerHTML = `
            <div class="error">
                ❌ Users load नहीं हो पाए
                <br><br>
                Server या MongoDB check करो
            </div>
        `;

    }

}


// Show users
function showUsers(users) {

    const contacts = document.getElementById("contacts");

    contacts.innerHTML = "";


    // Current user को list में मत दिखाओ
    const otherUsers = users.filter(
        user => user.mobile !== myMobile
    );


    if (otherUsers.length === 0) {

        contacts.innerHTML = `
            <div class="empty">
                अभी कोई दूसरा user नहीं है
            </div>
        `;

        return;

    }


    otherUsers.forEach(user => {

        const div = document.createElement("div");

        div.className = "user";


        const firstLetter =
            user.name
                ? user.name.charAt(0).toUpperCase()
                : "?";


        div.innerHTML = `

            <div class="dp small">
                ${firstLetter}
            </div>

            <div class="user-info">

                <h3>
                    ${user.name}
                </h3>

                <p>
                    📱 ${user.mobile}
                </p>

            </div>

            <div class="arrow">
                ›
            </div>

        `;


        // User पर click
        div.addEventListener("click", function () {

            openChat(user);

        });


        contacts.appendChild(div);

    });

}


// Open chat
function openChat(user) {

    localStorage.setItem(
        "chatUserName",
        user.name
    );

    localStorage.setItem(
        "chatUserMobile",
        user.mobile
    );


    window.location.href = "index.html";

}


// Search
document
    .getElementById("searchInput")
    .addEventListener("input", function () {

        const search =
            this.value.toLowerCase().trim();


        const filtered =
            allUsers.filter(user =>

                user.mobile !== myMobile &&

                (
                    user.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    user.mobile
                        .includes(search)
                )

            );


        showUsers(filtered);

    });


// New Chat button
function newChat() {

    document
        .getElementById("searchInput")
        .focus();

}


// Load users
loadUsers();

</script>

</body>

</html>
