<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Friend Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(135deg,#090979,#020024,#000000);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:500px;
height:500px;

background:#00f7ff;

border-radius:50%;

filter:blur(160px);

top:-120px;
left:-120px;

animation:move1 10s infinite alternate;

}

body::after{

content:"";

position:absolute;

width:500px;
height:500px;

background:#ff00f7;

border-radius:50%;

filter:blur(160px);

bottom:-150px;
right:-120px;

animation:move2 12s infinite alternate;

}

@keyframes move1{

100%{

transform:translate(180px,120px);

}

}

@keyframes move2{

100%{

transform:translate(-180px,-120px);

}

}

.login{

position:relative;

width:390px;

padding:45px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(25px);

border-radius:25px;

box-shadow:

0 0 50px rgba(0,255,255,.25);

border:1px solid rgba(255,255,255,.15);

text-align:center;

z-index:5;

}

.logo{

font-size:75px;

margin-bottom:15px;

animation:logo 2s infinite alternate;

}

@keyframes logo{

100%{

transform:scale(1.1) rotate(5deg);

}

}

h1{

color:white;

font-size:35px;

margin-bottom:5px;

}

p{

color:#d6d6d6;

margin-bottom:35px;

}

input{

width:100%;

padding:16px;

margin-bottom:18px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.2);

border-radius:15px;

color:white;

font-size:16px;

outline:none;

transition:.4s;

}

input::placeholder{

color:#cccccc;

}

input:focus{

border-color:#00eaff;

box-shadow:0 0 20px #00eaff;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

background:linear-gradient(90deg,#00eaff,#006eff);

color:white;

transition:.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:0 0 25px #00eaff;

}

.footer{

margin-top:25px;

font-size:14px;

color:#ddd;

}

</style>

</head>

<body>

<div class="login">

<div class="logo">💬</div>

<h1>Friend Chat</h1>

<p>Secure Messaging Platform</p>

<input id="name" placeholder="👤 Your Name">

<input id="mobile" placeholder="📱 Mobile Number" maxlength="10">

<button onclick="login()">Continue →</button>

<div class="footer">

Powered by Friend Chat

</div>

</div>

<script>

function login(){

let name=document.getElementById("name").value.trim();

let mobile=document.getElementById("mobile").value.trim();

if(name==""||mobile==""){

alert("Please enter Name and Mobile Number");

return;

}

if(mobile.length!=10){

alert("Enter a valid 10-digit mobile number");

return;

}

localStorage.setItem("name",name);

localStorage.setItem("mobile",mobile);

window.location="index.html";

}

</script>

</body>
</html>
