<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friend Chat Login</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}


body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(135deg,#2563eb,#06b6d4,#22c55e);

}



/* CARD */

.login-box{

    width:390px;

    padding:40px;

    border-radius:30px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.3);

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

    text-align:center;

}




.logo{

    width:80px;

    height:80px;

    margin:auto;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    color:#2563eb;

    font-size:40px;

    font-weight:bold;

}




h1{

    color:white;

    margin-top:20px;

    font-size:32px;

}



p{

    color:#e5e7eb;

    margin:10px 0 30px;

}




input{

    width:100%;

    padding:15px;

    margin-bottom:18px;

    border:none;

    outline:none;

    border-radius:15px;

    font-size:16px;

    background:white;

}





button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    font-size:18px;

    font-weight:bold;

    color:white;

    background:
    linear-gradient(135deg,#2563eb,#06b6d4);

    transition:.3s;

}



button:hover{

    transform:scale(1.05);

}



.footer{

    margin-top:25px;

    color:#eee;

    font-size:13px;

}



</style>


</head>



<body>



<div class="login-box">


<div class="logo">

FC

</div>


<h1>
Friend Chat
</h1>


<p>
Connect with your friends
</p>




<input 
id="name"
type="text"
placeholder="Enter your name"
>




<input
id="mobile"
type="number"
placeholder="Enter mobile number"
>



<button onclick="login()">

Continue →

</button>




<div class="footer">

Secure Messaging Platform

</div>



</div>





<script>


function login(){


let name=document.getElementById("name").value.trim();

let mobile=document.getElementById("mobile").value.trim();



if(name==""){

alert("Enter your name");

return;

}



if(mobile.length!=10){

alert("Enter valid 10 digit mobile number");

return;

}



localStorage.setItem("name",name);

localStorage.setItem("mobile",mobile);



window.location="home.html";


}



</script>



</body>

</html>
