<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friend Chat - Login</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    background:
        radial-gradient(circle at 10% 10%, rgba(79,70,229,.35), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(14,165,233,.25), transparent 35%),
        #080b18;

    overflow-x: hidden;
}


/* =========================
   BACKGROUND LIGHTS
========================= */

body::before {

    content: "";

    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    background: #4f46e5;

    filter: blur(130px);

    opacity: .35;

    top: -150px;
    left: -150px;

    pointer-events: none;
}

body::after {

    content: "";

    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    background: #06b6d4;

    filter: blur(130px);

    opacity: .25;

    right: -150px;
    bottom: -150px;

    pointer-events: none;
}


/* =========================
   LOGIN BOX
========================= */

.login {

    position: relative;

    width: 100%;
    max-width: 410px;

    padding: 38px 32px;

    background: rgba(255,255,255,.08);

    border: 1px solid rgba(255,255,255,.14);

    border-radius: 24px;

    backdrop-filter: blur(22px);

    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);

    text-align: center;

    z-index: 2;
}


/* =========================
   LOGO
========================= */

.logo {

    width: 76px;
    height: 76px;

    margin: 0 auto 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 22px;

    background: linear-gradient(
        135deg,
        #4f46e5,
        #06b6d4
    );

    color: white;

    font-size: 36px;

    box-shadow:
        0 12px 30px rgba(79,70,229,.35);
}


/* =========================
   TEXT
========================= */

h1 {

    color: white;

    font-size: 30px;

    font-weight: 700;

    margin-bottom: 7px;
}

.subtitle {

    color: #b9c0d4;

    font-size: 14px;

    margin-bottom: 30px;
}


/* =========================
   INPUT
========================= */

.input-box {

    position: relative;

    margin-bottom: 16px;
}

.input-box span {

    position: absolute;

    left: 16px;

    top: 50%;

    transform: translateY(-50%);

    font-size: 17px;

    opacity: .8;

    pointer-events: none;
}

input {

    width: 100%;

    height: 54px;

    padding: 0 16px 0 46px;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,.14);

    outline: none;

    background: rgba(255,255,255,.07);

    color: white;

    font-size: 15px;

    transition: .2s;
}

input::placeholder {

    color: #9da5ba;
}

input:focus {

    border-color: #6366f1;

    background: rgba(255,255,255,.10);

    box-shadow:
        0 0 0 3px rgba(99,102,241,.14);
}


/* =========================
   BUTTON
========================= */

button {

    width: 100%;

    height: 54px;

    margin-top: 6px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #2563eb
        );

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;

    box-shadow:
        0 10px 25px rgba(37,99,235,.25);
}

button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 14px 30px rgba(37,99,235,.35);
}

button:active {

    transform: scale(.98);
}


/* =========================
   LOADING
========================= */

button.loading {

    opacity: .7;

    pointer-events: none;
}


/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 24px;

    color: #8f98ad;

    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {

        padding: 14px;

        align-items: center;
    }

    .login {

        padding: 30px 22px;

        border-radius: 20px;
    }

    .logo {

        width: 68px;
        height: 68px;

        font-size: 31px;

        border-radius: 19px;
    }

    h1 {

        font-size: 26px;
    }

    .subtitle {

        margin-bottom: 24px;
    }

    input,
    button {

        height: 52px;
    }
}


/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 360px) {

    .login {

        padding: 25px 18px;
    }

    h1 {

        font-size: 24px;
    }

    .logo {

        width: 62px;
        height: 62px;
    }
}

</style>

</head>


<body>


<div class="login">


    <div class="logo">
        💬
    </div>


    <h1>
        Friend Chat
    </h1>


    <p class="subtitle">
        Connect • Chat • Share
    </p>


    <!-- Name -->

    <div class="input-box">

        <span>👤</span>

        <input
            id="name"
            type="text"
            placeholder="Enter your name"
            autocomplete="name"
        >

    </div>


    <!-- Mobile -->

    <div class="input-box">

        <span>📱</span>

        <input
            id="mobile"
            type="tel"
            placeholder="10-digit mobile number"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel"
        >

    </div>


    <button
        id="loginButton"
        onclick="login()"
    >
        Continue →
    </button>


    <div class="footer">
        Your account will be saved securely
    </div>


</div>


<script>


async function login() {


    const nameInput =
        document.getElementById("name");

    const mobileInput =
        document.getElementById("mobile");

    const button =
        document.getElementById("loginButton");


    const name =
        nameInput.value.trim();

    const mobile =
        mobileInput.value.trim();


    // Name check

    if (name === "") {

        alert("अपना नाम डालो");

        nameInput.focus();

        return;
    }


    // Mobile check

    if (!/^[0-9]{10}$/.test(mobile)) {

        alert("10 digit mobile number डालो");

        mobileInput.focus();

        return;
    }


    // Loading

    button.innerText = "Connecting...";

    button.classList.add("loading");


    try {


        const response = await fetch(

            "https://friend-chat-1-5k6l.onrender.com/register",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    name: name,

                    mobile: mobile

                })

            }

        );


        const data =
            await response.json();


        console.log("Register Response:", data);


        if (!response.ok) {

            throw new Error(
                data.error || "Registration failed"
            );

        }


        // Save login information

        localStorage.setItem(
            "name",
            data.user.name
        );

        localStorage.setItem(
            "mobile",
            data.user.mobile
        );


        // Home खोलो

        window.location.href =
            "home.html";


    } catch (error) {


        console.log("Login Error:", error);


        alert(
            "Server से connection नहीं हो पाया। थोड़ी देर बाद फिर try करो।"
        );


        button.innerText =
            "Continue →";

        button.classList.remove(
            "loading"
        );

    }

}


</script>


</body>

</html>
